# Every channel the repository packages, attached to a published release.
#
# A tag builds them and attaches what built.
# `workflow_dispatch` builds the same set and attaches nothing,
# which is the run to make before tagging.
#
# Every binary is built on the system it runs on.
# The backend links GStreamer through cgo,
# and no cross toolchain builds that (docs/packaging.md),
# so there is no matrix over targets here.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    uses: ./.github/workflows/version.yml

  # The portable tarball, for a distribution this repository packages nothing for.
  # The Flatpak assembles what this job stages, so it is an input to that job as well.
  tarball:
    needs: version
    runs-on: ubuntu-26.04
    env:
      # What the archive is named and what the backend link stamps into the binary.
      # Unset, the script builds a binary calling itself dev (scripts/package-linux.sh).
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The development files cgo compiles against, for the pkg-config modules
      # backend/internal/receive and backend/internal/pointer name.
      # The runtime plugin set stays out: nothing here starts a pipeline.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libegl-dev \
            libx11-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK the Nix build carries, so both channels compile with one toolchain.
          dotnet-version: "10.0.302"

      - name: Package
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tarball
          path: build/dist/*.tar.gz
          if-no-files-found: error

  # The Flatpak, for the distributions the tarball leaves out:
  # that artifact takes GStreamer from the machine and the backend links symbols 1.26 introduced.
  #
  # It takes the tarball above rather than building the app again.
  # The runtime carries GStreamer and the extension carries the codecs it leaves out,
  # so what is compiled here is ffmpeg and ffplay alone, which no extension ships
  # (packaging/flatpak).
  flatpak:
    needs: [version, tarball]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-tarball
          path: incoming

      # Into build/dist, where the manifest's `dir` source reads it,
      # and holding the staged directory alone: the manifest globs for it.
      - name: Unpack the tarball
        run: |
          mkdir -p build/dist
          tar -xzf incoming/*.tar.gz -C build/dist

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      # flatpak-builder keeps each module's build state here and skips a module whose
      # definition is unchanged, which is what stops ffmpeg compiling on every run.
      # The key is the manifest: editing the ffmpeg module is what has to rebuild it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-${{ hashFiles('packaging/flatpak/de.bjoernblessin.MirrorMe.yml') }}
          restore-keys: flatpak-

      - name: Package Flatpak
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flatpak-builder --user --force-clean --repo=build/flatpak-repo \
            build/flatpak-build packaging/flatpak/de.bjoernblessin.MirrorMe.yml
          flatpak build-bundle build/flatpak-repo \
            "build/dist/mirrorme-$VERSION-x86_64.flatpak" de.bjoernblessin.MirrorMe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: build/dist/*.flatpak
          if-no-files-found: error

  # The Windows zip, which carries its own ffmpeg and GStreamer because Windows has no
  # dependency manager the app can lean on (docs/packaging.md).
  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Read by the packaging script for the zip's name,
      # and passed down to the backend link as the build stamp (Taskfile.yml, package:windows).
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The toolchain and the GStreamer development files the backend links,
      # and the gst-launch-1.0.exe it spawns.
      # The same package list docs/packaging.md names.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-gst-plugins-ugly
            mingw-w64-x86_64-gst-plugins-rs
            mingw-w64-x86_64-gst-rtsp-server
            mingw-w64-x86_64-gst-libav
            mingw-w64-x86_64-glib-networking

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      # ffmpeg and ffplay ship inside the zip, so they are fetched rather than installed:
      # the build tasks copy whatever is in build/windows/redist next to the binaries.
      # A full build rather than an essentials one, because ddagrab and ffplay are both
      # needed and the smaller builds drop one or the other.
      - name: Fetch ffmpeg
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          New-Item -ItemType Directory -Force -Path build/windows/redist | Out-Null
          foreach ($exe in 'ffmpeg.exe', 'ffplay.exe') {
            $found = Get-ChildItem -Path ffmpeg-dist -Recurse -Filter $exe | Select-Object -First 1
            if (-not $found) { throw "$exe is not in the downloaded build" }
            Copy-Item $found.FullName build/windows/redist/
          }

          # A GPL build, so its license text is part of what the zip has to carry
          # (THIRD-PARTY-NOTICES.md). The packaging script picks it up under this name.
          $license = Get-ChildItem -Path ffmpeg-dist -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if (-not $license) { throw "the downloaded ffmpeg build carries no LICENSE.txt" }
          Copy-Item $license.FullName build/windows/redist/ffmpeg-LICENSE.txt

      # The installer compiler, which the runner image does not carry.
      # Chocolatey is what it does carry, and this is the package Inno Setup publishes there.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # MSYS2_ROOT is what the build and bundle tasks resolve the toolchain,
      # the plugin prefix and MSYS2's own sh through.
      # The action installs somewhere other than the default C:/msys64,
      # so it is named here rather than assumed.
      #
      # The installer task depends on the zip task, so one call builds both
      # and the two carry the same staged directory (scripts/installer-windows.ps1).
      - name: Package
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: task package:windows:installer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: |
            build/dist/*.zip
            build/dist/*-setup.exe
          if-no-files-found: error

  # The flake's package, which is what a NixOS install reads. Nothing is uploaded: a Nix
  # user builds from the flake rather than downloading an artifact, so what this proves
  # is that the derivation still evaluates and builds.
  # No VERSION reaches this job.
  # A pure build is the one a Nix user runs and the one the cache below serves,
  # so a version passed in here would push a derivation nobody else asks for (flake.nix).
  nix:
    runs-on: ubuntu-latest
    env:
      # Lifted into env because a step's `if` cannot read secrets.
      # Empty on a pull request from a fork, where the build runs and pushes nothing.
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The flake overlays GStreamer to turn on the Vulkan and QSV plugins, and builds
      # gst-plugins-rs from an explicit plugin list, neither of which the public binary
      # cache carries. The Attic cache below is where those land, so a run downloads
      # what an earlier run compiled.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-cache.bjoernblessin.de/screen-sharing
            extra-trusted-public-keys = screen-sharing:0wAX2u4GPUvsZmRMsjut6HjhdYfBErcjQCHTXiJ0yPM=

      - run: nix build .#mirrorme --print-build-logs

      # The whole closure, so a machine with none of it downloads rather than compiles:
      # a fresh runner, a contributor's checkout, a laptop after a garbage collection.
      - name: Push to the cache
        if: env.ATTIC_TOKEN != ''
        run: |
          nix run .#attic-client -- login \
            hh https://nix-cache.bjoernblessin.de "$ATTIC_TOKEN"
          nix run .#attic-client -- push hh:screen-sharing result

  # The Arch package. The source is the tarball this job writes rather than a downloaded
  # release: makepkg uses a file already sitting beside the PKGBUILD and downloads
  # nothing, so the package is built from the commit under test.
  #
  # Pinned by digest, as every action here is:
  # a base image that moves can redden a release with no commit behind it.
  # archlinux:base-devel as of this pin.
  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux@sha256:ee205c220399524a683cf495d411691b921baed8ab47cdc6d732efa782fae484
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Before the checkout, because a checkout into a container without git falls back
      # to a source download and leaves no repository for `git archive` to read.
      #
      # The two toolchains, plus the libraries the cgo build compiles against. Arch ships
      # the development files in the same packages the app depends on at run time, and
      # makepkg runs with --nodeps below, so they are installed here rather than resolved
      # from the PKGBUILD.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git go dotnet-sdk-10.0 gstreamer gst-plugins-base libglvnd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # makepkg refuses to run as root, and the container has no other user.
      - name: Build
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          git archive --prefix="mirrorme-$VERSION/" -o "packaging/arch/mirrorme-$VERSION.tar.gz" HEAD
          chown -R builder packaging/arch
          su builder -c "cd packaging/arch && VERSION='$VERSION' makepkg --nodeps --noconfirm"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  # The Fedora package, built the same way and for the same reason: rpmbuild reads
  # SOURCES and downloads nothing. fedora:latest as of this pin.
  fedora:
    needs: version
    runs-on: ubuntu-latest
    container: fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Before the checkout, for the reason the Arch job states.
      - name: Install build dependencies
        run: |
          dnf install -y \
            git rpm-build rpmdevtools \
            gcc golang dotnet-sdk-10.0 \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            mesa-libEGL-devel desktop-file-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package is copied back into the workspace because the upload step globs
      # relative to it and expands no home directory.
      - name: Build
        run: |
          rpmdev-setuptree
          git config --global --add safe.directory "$PWD"
          git archive --prefix="mirrorme-$VERSION/" \
            -o "$HOME/rpmbuild/SOURCES/mirrorme-$VERSION.tar.gz" HEAD
          rpmbuild -bb --define "appversion $VERSION" packaging/fedora/mirrorme.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-package
          path: "*.rpm"
          if-no-files-found: error

  # A published release gets what the jobs above built.
  # Nothing is rebuilt here, so the files attached to a release are the ones that passed.
  #
  # always(), so a red channel costs its own asset alone.
  # A strict `needs` cost every asset over one broken channel,
  # and a release with four downloads beside a red run says more than a release with none.
  #
  # Only the assets are written.
  # The release text belongs to whoever published it,
  # and a re-run that rewrote it would lose what they typed.
  release:
    if: ${{ always() && github.event_name == 'release' }}
    needs: [version, tarball, flatpak, windows, nix, arch, fedora]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
          fail_on_unmatched_files: false

      # After the upload, so a channel that built is attached whatever this reports.
      # One list: adding a channel is one edit,
      # and a pattern matching nothing names the job that went red.
      - name: Every channel attached
        run: |
          missing=
          for pattern in \
            '*-linux-x86_64-portable.tar.gz' \
            '*.flatpak' \
            '*-windows-x86_64.zip' \
            '*-windows-x86_64-setup.exe' \
            '*.pkg.tar.zst' \
            '*.rpm'
          do
            compgen -G "artifacts/$pattern" >/dev/null || missing="$missing $pattern"
          done
          [ -z "$missing" ] || { echo "the release carries no:$missing" >&2; exit 1; }
