# What a push has to satisfy: both binaries compile, and both suites pass.
#
# Packaging is release.yml's. A push answers whether the code builds,
# and what a tag produces is a question a tag asks.
#
# Every binary is built on the system it runs on.
# The backend links GStreamer through cgo,
# and no cross toolchain builds that (docs/packaging.md),
# so there is no matrix over targets here.

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two sets. The development files cgo compiles against, for the pkg-config modules
      # backend/internal/receive and backend/internal/pointer name.
      # Then what the Go suite needs to answer at all:
      # ffmpeg and the plugin set its pipelines build, and an X server for the x11grab paths.
      #
      # Three of them are on the list for what they carry rather than what they are named for.
      # gstreamer1.0-x holds the pango plugin, so timeoverlay comes from there,
      # which the test streams build (internal/publish).
      # gstreamer1.0-gl holds the glupload chain,
      # and the render chain a draft is repaired towards is the one the machine can run,
      # so a lean plugin set moves a legal value and internal/form reads that as a repair.
      # xauth is named because xvfb-run runs it, and --no-install-recommends drops it.
      #
      # The image is named rather than taken as -latest.
      # go-gst binds `GstIdStr`, which GStreamer 1.26 introduced,
      # and an image older than that builds no backend.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libegl-dev \
            libx11-dev \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-x \
            gstreamer1.0-gl \
            xvfb \
            xauth

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          # The module is not at the repository root,
          # and the cache key is read from the checksum file rather than found.
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK the Nix build carries, so both channels compile with one toolchain.
          dotnet-version: "10.0.302"

      # xvfb-run because x11grab refuses to build arguments without a DISPLAY,
      # and the builders under test go through that refusal (backend/internal/ffmpeg).
      #
      # The `hardware` tag stays off. What it gates needs a DRM card node to answer,
      # which a runner has none of (backend/internal/ffmpeg/gpu_test.go).
      # `task backend:test` is the local run that includes it.
      #
      # The shell's suite is view models against fakes and needs neither.
      - name: Check
        env:
          CGO_ENABLED: "1"
        run: |
          go build -C backend ./...
          go vet -C backend ./...
          xvfb-run -a go test -C backend ./...
          dotnet test avalonia/ScreenShare.App.sln

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pkg-config modules cgo resolves, and nothing beyond them:
      # gstreamer-1.0 and gstreamer-d3d11-1.0 (internal/receive/share_windows.go),
      # gstreamer-video-1.0 and gstreamer-pbutils-1.0 (the same package).
      # d3d11 puts gst-plugins-bad on the list, the .pc file living there.
      # The runtime plugins and gst-launch-1.0 belong to the packaged build, so release.yml
      # installs more than this.
      # lld is the linker the backend links through, which build:windows in Taskfile.yml explains.
      #
      # update: false, as the packaged build takes it (.github/actions/msys2):
      # both install the versions the action's installer snapshot names,
      # so the binary checked here and the one shipped link one GStreamer and compile through one gcc.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-bad
            mingw-w64-x86_64-lld

      # The build cache is saved on every push under a key naming the commit,
      # and the nearest one is restored:
      # setup-go's own cache saves once per go.sum change, and every cgo package it holds is stale by the next push.
      # release.yml restores the same entry on a tag, where only what main saved is readable,
      # so the link is what its build has left to do.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-windows-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-windows-${{ hashFiles('backend/go.sum') }}-
            go-windows-

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"

      # Compilation and the shell's suite. The Go suite spawns ffmpeg and builds pipelines,
      # neither of which is installed here.
      #
      # The MSYS2 prefix is appended rather than prepended, which is what the dev task does
      # and for the same reason: MSYS2 ships an ffmpeg of its own
      # and a prefix in front would take over every capture and encode.
      #
      # cgo takes its compiler and its pkg-config by path instead of by name,
      # as Taskfile.yml does. The image carries Strawberry Perl's `gcc` and `pkg-config`
      # ahead of the appended prefix, and that pkg-config resolves against
      # C:/Strawberry/c/lib/pkgconfig, where no GStreamer module lives.
      # Both spelled with forward slashes, the form Taskfile.yml derives from MSYS2_ROOT:
      # Go hashes the CC string into every cgo package's cache key,
      # so a build naming the compiler another way reuses nothing this one compiled.
      #
      # The link goes through lld, for the reason build:windows states in Taskfile.yml,
      # and the run after it starts what that link produced.
      # Nothing else here does, and a linker is the one part of a build
      # whose mistakes surface at load rather than at compile.
      # A cgo package with no test selected: the binary still starts, resolves its imports and exits.
      - name: Check
        env:
          CGO_ENABLED: "1"
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}".Replace('\', '/')
          $env:CC = "$root/mingw64/bin/gcc.exe"
          $env:PKG_CONFIG = "$root/mingw64/bin/pkg-config.exe"
          $msys2 = "$root/mingw64/bin"
          $env:PATH = "$env:PATH;$msys2"

          # A pwsh step reports the exit code of its last command,
          # so a failed build in front of a passing test suite reports green.
          # Each one is checked instead.
          go build -C backend -ldflags "-extldflags=-fuse-ld=lld" ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -C backend ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The prefix goes in front for the run alone.
          # Windows resolves an imported DLL by walking PATH,
          # this image carries rival copies of the mingw runtime (Git for Windows, Strawberry Perl),
          # and one reached before MSYS2's kills the process before main,
          # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
          # Appended is what every other step wants, MSYS2 shipping an ffmpeg of its own,
          # and nothing here spawns one.
          $env:PATH = "$msys2;$env:PATH"
          go test -C backend -ldflags "-extldflags=-fuse-ld=lld" -run '^$' ./internal/receive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test avalonia/ScreenShare.App.sln
