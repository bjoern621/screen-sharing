# The relay, the proxy and the group service as container images, for a Kubernetes deployment.
#
# Separate from release.yml because these are the only artifacts needing registry write access,
# and because they are cheap enough to build on every push.
#
# A push builds all three to prove they still build,
# which is what keeps the flake under test between releases.
# A published release pushes them, so an image tag names a release and never moves:
# the cluster repository pins an exact tag and Renovate bumps it,
# and a tag rewritten on every commit to main would make that pin a lie.

name: images

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      # Independent images. One failing to build says nothing about the others,
      # and a cancelled sibling hides which.
      fail-fast: false
      matrix:
        include:
          - package: relay-image
            image: screenshare-relay
          - package: proxy-image
            image: screenshare-proxy
          - package: groupd-image
            image: screenshare-groupd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "release $TAG does not match VERSION ($version)" >&2
            exit 1
          fi

          nix build ".#${{ matrix.package }}"

      # The Nix builder writes a docker-archive tarball, which is the format `docker load`
      # reads, so the runner's own docker is the whole publishing toolchain.
      - if: github.event_name == 'release'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail

          docker load < result
          echo '${{ secrets.GITHUB_TOKEN }}' |
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          docker tag "${{ matrix.image }}:$VERSION" "$REGISTRY/${{ matrix.image }}:$VERSION"
          docker push "$REGISTRY/${{ matrix.image }}:$VERSION"
