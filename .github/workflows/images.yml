# The relay, the proxy and the group service as container images, for a Kubernetes deployment.
#
# Separate from release.yml because these are the only artifacts needing registry write access.
#
# A published release builds all three and pushes them,
# so an image tag names a release and never moves:
# the cluster repository pins an exact tag and Renovate bumps it,
# and a tag rewritten on every commit to main would make that pin a lie.
# `workflow_dispatch` builds the same set and pushes nothing,
# which is the run to make before tagging.

name: images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    uses: ./.github/workflows/version.yml

  images:
    needs: version
    runs-on: ubuntu-latest
    env:
      # The tag the image carries inside it and the tag it is pushed under, one number.
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      # Independent images. One failing to build says nothing about the others,
      # and a cancelled sibling hides which.
      fail-fast: false
      matrix:
        include:
          - package: relay-image
            image: screenshare-relay
          - package: proxy-image
            image: screenshare-proxy
          - package: groupd-image
            image: screenshare-groupd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # --impure, which is what lets the flake read VERSION from the environment:
      # under pure evaluation it tags an image after the revision instead (flake.nix).
      - run: nix build --impure ".#${{ matrix.package }}"

      # The Nix builder writes a docker-archive tarball, which is the format `docker load`
      # reads, so the runner's own docker is the whole publishing toolchain.
      - if: github.event_name == 'release'
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail

          docker load < result
          echo '${{ secrets.GITHUB_TOKEN }}' |
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          docker tag "${{ matrix.image }}:$VERSION" "$REGISTRY/${{ matrix.image }}:$VERSION"
          docker push "$REGISTRY/${{ matrix.image }}:$VERSION"
