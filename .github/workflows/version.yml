# The version a run names and stamps every artifact with, computed once so no job can disagree.
#
# A published release takes it from its tag, which is the one place the number lives:
# a file in the tree stating it is a second answer,
# free to disagree with the tag the artifact ships under.
# Every other run builds no release, so it takes a development version carrying the commit.
#
# Called by release.yml and images.yml rather than written into both.
# A check kept in two files is one that drifts.

name: version

on:
  workflow_call:
    outputs:
      version:
        description: What every artifact of the calling run is named and stamped with.
        value: ${{ jobs.compute.outputs.version }}

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      # No checkout: the trigger carries everything read here.
      - id: compute
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "$TAG" ]; then
            # The leading v is the tag's, and no artifact name or package version wears one.
            case "$TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "the release tag $TAG is not vX.Y.Z" >&2
                exit 1
                ;;
            esac
            version=${TAG#v}
          else
            # Separated by dots alone:
            # a docker tag rejects "+" and an Arch or rpm version rejects "-",
            # and this number reaches all three.
            # Four fields rather than three,
            # which the release check reads as a version it cannot compare
            # (backend/internal/release).
            version=0.0.0.dev.${SHA:0:7}
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
