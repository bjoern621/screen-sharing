version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  relay:
    desc: Run the MediaMTX relay natively (SRT 8890/udp, API 9997)
    cmds:
      - mediamtx mediamtx.yml

  relay:docker:
    desc: Run the relay in Docker (Linux relay box / VPS)
    cmds:
      - docker compose up

  gridviewer:
    desc: Build the GTK grid viewer binary into desktop/build/bin
    dir: desktop
    cmds:
      - go build -o build/bin/screenshare-gridviewer ./cmd/gridviewer

  dev:
    desc: Run the Wails app with live reload
    dir: desktop
    deps: [gridviewer]
    env:
      # wails dev runs the app from a temp dir, so the viewer is not found next
      # to the executable; point the app at the freshly built one instead.
      SCREENSHARE_GRIDVIEWER: "{{.ROOT_DIR}}/desktop/build/bin/screenshare-gridviewer"
    cmds:
      # webkit2_41 targets webkitgtk 4.1 (libsoup3), matching the flake's dev shell
      - wails dev -tags webkit2_41

  build:
    desc: Build the Wails app binary into desktop/build/bin
    dir: desktop
    cmds:
      - wails build -tags webkit2_41
      # after wails build, so the viewer always sits next to the app binary
      - go build -o build/bin/screenshare-gridviewer ./cmd/gridviewer

  build:windows:
    desc: Cross-build the Windows binary and bundle ffmpeg/ffplay into desktop/build/bin
    dir: desktop
    # No webkit2_41 tag: Windows uses WebView2, not webkitgtk. The postBuildHook
    # in wails.json copies build/windows/redist/{ffmpeg,ffplay}.exe next to the
    # binary, so drop those two executables there first (see that directory's README).
    cmds:
      - wails build -platform windows/amd64
