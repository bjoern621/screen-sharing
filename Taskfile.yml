version: "3"

vars:
  # MSYS2 prefix: the Windows toolchain and the GStreamer the backend links through cgo.
  # Named here rather than read from the shell, so a build works from whichever shell is open:
  # Git Bash announces MSYSTEM=MINGW64 over a /mingw64 of its own holding none of this,
  # and a plain PowerShell carries nothing.
  # MSYS2_ROOT names an install somewhere other than the default.
  MSYS2_ROOT: '{{default "C:/msys64" .MSYS2_ROOT}}'
  MSYS2_MINGW: '{{.MSYS2_ROOT}}/mingw64'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  all:
    desc: Run the relay, the backend and the Avalonia app together
    # deps rather than cmds: deps run concurrently, cmds in sequence, and none of the three returns.
    # Nothing orders them, and nothing needs to:
    # the backend polls the relay for as long as it runs,
    # and the shell reaches a backend that started after the window did.
    # One terminal carries all three logs interleaved.
    # `task all --output prefixed` tags every line with the task it came from.
    deps: [relay, dev, avalonia]

  relay:
    desc: Run the relay and the group service beside it, on deploy/mediamtx-groups.yml
    # A script and not a command: three things come up together.
    # A self-signed certificate for the TLS listeners where none is drawn.
    # The group service every token is verified against.
    # The relay itself, the deployment's certificate and hook paths overridden
    # through MediaMTX's environment.
    #
    # mediamtx and openssl come from the flake's dev shell.
    # Windows has neither, so the PowerShell half fetches mediamtx.exe into bin/ on first run
    # and draws the certificate through .NET.
    cmds:
      - platforms: [linux, darwin]
        cmd: bash scripts/relay.sh
      - platforms: [windows]
        cmd: pwsh -NoProfile -File scripts/relay.ps1

  api:
    desc: Lint, breaking-check and regenerate the control contract
    dir: api
    # The generated Go is committed, so a fresh clone builds with no protobuf toolchain,
    # and this task is what keeps it current.
    # The breaking check runs before the generation:
    # a change that would break a shipped shell fails before the generated code is rewritten.
    cmds:
      - buf lint
      # A first commit of the contract has no earlier state to compare against,
      # so a missing baseline is not a failure of this task.
      # The .git this compares against is the repository root's and this task runs from api/,
      # so the path climbs out of the module.
      - cmd: buf breaking --against '../.git#branch=main,subdir=api'
        ignore_error: true
      - buf generate

  api:lint:
    desc: Lint the control contract without regenerating
    dir: api
    cmds:
      - buf lint

  avalonia:
    desc: Run the Avalonia app (relay connection check)
    dir: avalonia
    env:
      # The endpoint `task dev` serves, kept off the one an installed build binds,
      # so both run at once and each shell reaches its own backend
      # (backend/internal/control/instance.go).
      SCREENSHARE_INSTANCE: dev
      # Starting a backend is `task dev`'s here.
      # The shell looks beside itself and then on PATH, and a checkout puts a backend on neither,
      # so a spawn picks up whichever binary an install left on PATH:
      # the window then shows that build's version and `task dev` finds its endpoint taken.
      # Off, a run without `task dev` reports the endpoint as unserved and names it.
      SCREENSHARE_BACKEND_SPAWN: "0"
    # No toolchain variable: this project links nothing through cgo, so MSYS2 stays out,
    # and the .NET SDK is on PATH either way,
    # system-wide on Windows and from the flake's dev shell on Linux and macOS,
    # where the shell also supplies the X11 and Skia libraries Avalonia dlopens
    # and the protoc pair Grpc.Tools cannot run its own copy of.
    # `task relay` first, or the app renders its failure state.
    cmds:
      - dotnet run --project ScreenShare.App

  avalonia:build:
    desc: Build the Avalonia app into build/bin
    dir: avalonia
    cmds:
      - dotnet build -c Release -o '{{.ROOT_DIR}}/build/bin/avalonia' ScreenShare.App/ScreenShare.App.csproj

  avalonia:test:
    desc: Run the Avalonia app's tests (no relay needed)
    dir: avalonia
    cmds:
      - dotnet test

  dev:
    desc: Run the backend in the foreground
    dir: backend
    env:
      # The endpoint `task avalonia` opens, kept off the one an installed build binds.
      SCREENSHARE_INSTANCE: dev
      # go-gst is a cgo binding, so every file in backend/internal/receive is gated on cgo.
      # Go turns CGO_ENABLED off by itself when it finds no C compiler,
      # so a build outside the toolchain's reach fails as "build constraints exclude all Go files"
      # in packages that look unrelated to the compiler.
      # Asking for cgo outright names the missing compiler instead.
      CGO_ENABLED: "1"
    cmds:
      # The backend has no window: it opens the control socket and waits,
      # and the Avalonia shell connects to it ('task avalonia').
      # Ending this task ends the children it supervises,
      # through the signal handler in backend/cmd/backend.
      #
      # The MSYS2 prefix on Windows answers two needs at once:
      # the toolchain and the GStreamer development files cgo compiles the receive pipelines against,
      # and the gst-launch-1.0.exe the publish side spawns.
      # Nothing puts that prefix on a normal PATH,
      # so a dev run without it does not build, and a build that skipped cgo finds no launcher either.
      # A packaged build carries its own copy of both beside the binary (scripts/bundle-windows.sh).
      #
      # Appended rather than prepended: MSYS2 ships an ffmpeg of its own,
      # and the prefix first would move every capture and encode onto it
      # instead of the ffmpeg the machine was set up with.
      # gcc and pkg-config have no such rival on a Windows PATH, so appending still finds them.
      #
      # Git for Windows' own /mingw64/bin comes off PATH first.
      # The frame channel links GStreamer's Direct3D 11 library, which is C++ and pulls in libstdc++-6.dll;
      # Git ships an older one of those, and Windows resolves an imported DLL by walking PATH,
      # so with Git's prefix ahead of MSYS2's the backend dies before main
      # with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
      # Dropped rather than reordered, which keeps the ffmpeg decision above intact.
      # A packaged build has neither problem:
      # the loader takes the binary's own directory before any PATH entry,
      # and bundle-windows.sh puts every DLL there.
      #
      # The Windows run frees the control pipe before it starts.
      # Nothing stale to clear there but a process:
      # `go run`'s child keeps the pipe open when a dev run ends without Ctrl+C reaching it,
      # and the next backend starts with no control socket at all,
      # so the shell connects to the older one and every edit looks like it did nothing.
      # scripts/dev-stop.ps1 carries the rest of that reasoning.
      # It does nothing when the pipe is free,
      # and fails this task rather than starting a second backend
      # when something outside this build tree holds it.
      - platforms: [windows]
        cmd: powershell -NoProfile -File '{{.ROOT_DIR}}/scripts/dev-stop.ps1'
      - platforms: [linux, darwin]
        cmd: go run ./cmd/backend
      # gcc and pkg-config by path, for the reason build:windows states.
      - platforms: [windows]
        cmd: >-
          PATH="$(echo "$PATH" | sed -E 's#[^;]*[gG]it[\\/]+mingw64[\\/]+bin;?##g');{{.MSYS2_MINGW}}/bin"
          CC='{{.MSYS2_MINGW}}/bin/gcc.exe' PKG_CONFIG='{{.MSYS2_MINGW}}/bin/pkg-config.exe'
          go run ./cmd/backend

  dev:stop:
    desc: Stop a backend a previous `task dev` left holding the control pipe
    # `task dev` already does this on its way up,
    # so this task covers a leftover backend in the way of something else:
    # a packaged build, a debugger run, a shell that keeps finding a backend nobody is looking at.
    platforms: [windows]
    cmds:
      - powershell -NoProfile -File scripts/dev-stop.ps1

  build:
    desc: Build the backend binary into build/bin
    # The toolchain and the GStreamer development files come from the flake's dev shell.
    # On Windows they come from MSYS2, which build:windows names.
    dir: backend
    env:
      CGO_ENABLED: "1"
    cmds:
      - go build -o '{{.ROOT_DIR}}/build/bin/screenshare-backend' ./cmd/backend

  build:windows:
    desc: Build the Windows backend binary and copy ffmpeg/ffplay in beside it
    # Built on Windows and never cross-compiled (docs/packaging.md):
    # the receive pipelines link GStreamer through cgo,
    # and a cgo build needs the target's own toolchain and development files.
    platforms: [windows]
    dir: backend
    env:
      CGO_ENABLED: "1"
      # cgo looks both up on PATH, where the MSYS2 prefix is appended,
      # so any other pair ahead of it decides the toolchain.
      # Strawberry Perl ships one, and its pkg-config resolves against a prefix holding no GStreamer.
      CC: '{{.MSYS2_MINGW}}/bin/gcc.exe'
      PKG_CONFIG: '{{.MSYS2_MINGW}}/bin/pkg-config.exe'
    cmds:
      # STAMP is the version the handshake answers with, which is what a window shows.
      # package:windows passes the run's VERSION down;
      # a build asked for here keeps the source default,
      # the mark of a binary nobody released (backend/cmd/backend/main.go).
      - cmd: >-
          PATH="$PATH;{{.MSYS2_MINGW}}/bin"
          go build -ldflags "-X main.version={{default "dev" .STAMP}}"
          -o '{{.ROOT_DIR}}/build/bin/screenshare-backend.exe' ./cmd/backend
      # ffmpeg and ffplay ship beside the binary,
      # so both executables go into build/windows/redist first (that directory's README).
      - cmd: powershell -NoProfile -Command "Copy-Item -Force '{{.ROOT_DIR}}/build/windows/redist/ffmpeg.exe','{{.ROOT_DIR}}/build/windows/redist/ffplay.exe' '{{.ROOT_DIR}}/build/bin/'"

  backend:test:
    desc: Run the backend's tests, the hardware ones included
    # The `hardware` tag gates what needs a DRM card node to answer at all
    # (backend/internal/ffmpeg/gpu_test.go), which is what CI leaves out.
    dir: backend
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -tags hardware ./...

  icons:
    desc: Redraw build/icons from the master at the sizes hicolor declares
    # The results are committed, so no packaging recipe carries an ImageMagick build dependency.
    cmds:
      - for size in 48 64 128 256 512; do magick build/appicon.png -resize ${size}x${size} build/icons/${size}.png; done

  package:linux:
    desc: Build the Linux release tarball into build/dist
    # The tarball is for distributions this repository packages nothing for.
    # Arch, Fedora and NixOS take the recipes under packaging/ and nix/ instead,
    # which declare ffmpeg and GStreamer as dependencies rather than leaving them to the reader.
    platforms: [linux]
    cmds:
      - bash scripts/package-linux.sh

  package:flatpak:
    desc: Build the Flatpak bundle into build/dist
    # The channel for a distribution packaging neither ffmpeg nor a new enough GStreamer.
    # It assembles what package:linux staged rather than compiling anything of its own,
    # a flatpak-builder module having no network to restore NuGet packages over.
    platforms: [linux]
    deps: [package:linux]
    cmds:
      - flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - flatpak-builder --user --force-clean --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/de.bjoernblessin.ScreenSharing.yml
      - flatpak build-bundle build/flatpak-repo build/dist/screen-sharing-{{.VERSION}}-x86_64.flatpak de.bjoernblessin.ScreenSharing
    vars:
      # What the bundle is named after, from the run rather than from the tree
      # (.github/workflows/version.yml).
      VERSION:
        sh: echo "${VERSION:-dev}"

  package:windows:
    desc: Build the Windows release zip into build/dist
    platforms: [windows]
    # The binaries and the runtime beside them:
    # build:windows produces the backend and copies ffmpeg and ffplay in,
    # bundle:windows adds the GStreamer closure,
    # and the script publishes the shell into the same directory and zips it.
    deps:
      - task: bundle:windows
        vars:
          STAMP:
            sh: echo "${VERSION:-dev}"
    cmds:
      - powershell -NoProfile -File scripts/package-windows.ps1

  bundle:windows:
    desc: Copy the GStreamer runtime the backend needs next to the built binaries
    platforms: [windows]
    deps:
      # STAMP travels to the build, this task standing between package:windows and it.
      - task: build:windows
        vars:
          STAMP: '{{.STAMP}}'
    # MSYS2's own sh runs the script and MINGW_PREFIX names the prefix to copy out of,
    # both having to be MSYS2's:
    # Git Bash ships an ldd and a cygpath of its own
    # and sets MINGW_PREFIX to a /mingw64 carrying no GStreamer at all,
    # so left to the shell this bundles the wrong tree or nothing.
    # The prefix is on PATH so ldd can resolve the DLLs it reports.
    cmds:
      - cmd: >-
          MINGW_PREFIX="{{.MSYS2_MINGW}}" PATH="{{.MSYS2_MINGW}}/bin;$PATH"
          '{{.MSYS2_ROOT}}/usr/bin/sh.exe' '{{.ROOT_DIR}}/scripts/bundle-windows.sh'
          '{{.ROOT_DIR}}/build/bin'
