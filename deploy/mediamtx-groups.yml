# The relay as it is configured once groups are in force.
#
# It is a second file rather than an edit to mediamtx.yml, because the two describe two
# deployments and both are real: the one beside it is a relay on a trusted network where
# anybody may publish, which is what a LAN stream and every test in this repository run
# against, and this one is a relay on the internet where a token decides. Turning the first
# into the second in place would make every existing setup refuse every existing publisher on
# the next pull.
#
# What enforces a prefix is here and not in the app. The app puts its streams under the prefix
# its key derives, or under the public one where it holds no key (backend/internal/group), and
# the relay refuses anything else: a client that skipped the prefix is refused by the machine
# serving the stream rather than by a convention it could ignore.
#
# Publishing without a group is still publishing with a token. A caller holding no key trades
# for one granting the public prefix, so every connection here is authenticated and encrypted
# whoever opened it, and what "public" drops is who may watch and nothing else.

logLevel: info

# per-reader outgoing queue (packets). Default 512 chokes on lossless keyframe
# bursts (one frame can be several MB); 16384 ~= 24MB headroom per reader.
writeQueueSize: 16384

# --- Who may do what -------------------------------------------------------------
#
# Every connection carries a JWT and the relay checks it against the key the group service
# publishes. The key is fetched once and every connection verified locally, which is what
# keeps the service out of the path of a stream: a relay that called it per connection would
# make an unreachable service an unwatchable stream.
#
# The permissions ride in the token rather than being listed here, because they are per group
# and there is no list of groups: a token grants a path expression anchored at the prefix its
# key derived, so a member reaches their own group's streams and no others
# (backend/internal/token, GroupPermissions).
#
# Every address here is loopback, which is the shape of a host running the relay, the group
# service and the proxy together. A deployment that splits them across machines overrides the
# addresses through MediaMTX's own environment variables (MTX_AUTHJWTJWKS and friends), so
# this file states one topology rather than carrying both.
authMethod: jwt
authJWTJWKS: http://127.0.0.1:9443/jwks.json
authJWTClaimKey: mediamtx_permissions

# Reading under the public prefix takes no token.
# The prefix is what a caller holding no key trades for, so a token on it proves nothing.
# What requiring one costs is the browser: an address opened by hand carries no header,
# and the 401 that follows asks a person to type a JWT.
#
# Read alone, so publishing under the prefix still names a token.
#
# The expression is anchored and a group prefix is base32, so no group is reachable through it.
# An exclusion names an action and a path and no protocol, so an RTSP or RTMP reader of a public
# stream is unauthenticated on the same terms, and SRT keeps the passphrase in pathDefaults.
authJWTExclude:
  - action: read
    path: ~^public/

# The API, the metrics and the playback endpoints are not for members. A token this service
# issues grants publishing and reading and nothing else, so those three are refused for
# everyone until an operator's own token grants them.

# --- SRT -------------------------------------------------------------------------
#
# SRT is UDP and has no TLS, so it is the one leg the reverse proxy cannot wrap. What it takes
# instead is a passphrase, relay-wide, written into both the publish and the read keys: one
# value an operator sets, and the app sends it on both legs.
#
# It is a second secret beside the group key and it protects a different thing: the group key
# decides which streams a member reaches, and this decides whether the packets on the wire are
# readable at all.
srt: yes
srtAddress: :8890

pathDefaults:
  srtPublishPassphrase: "CHANGE-ME-16-CHARS-MINIMUM"
  srtReadPassphrase: "CHANGE-ME-16-CHARS-MINIMUM"

# --- The listeners the proxy fronts ----------------------------------------------
#
# HLS and WebRTC bind loopback. TLS, the certificate and its renewal live in the reverse proxy
# in front of them (deploy/Caddyfile), which is where ACME is.
#
# RTSP and RTMP are not HTTP, so no proxy can carry them and each terminates TLS itself, on a
# listener of its own. The certificate is the proxy's, handed over by the deployment: the paths
# below are placeholders and every real deployment overrides them from the environment, the way
# the SRT passphrase above is set (modules/mediamtx-relay.nix in the nixos-config repository).
#
# `strict` on both, so the cleartext listener is not merely unexposed but absent: a relay that
# still bound 8554 would carry a stream in the clear for anyone who reached it, and a firewall
# is the wrong place for that decision to live.
# The cleartext ports are what a LAN relay uses, and that is the mediamtx.yml at this
# repository's root rather than a weaker setting on this file.
rtsp: yes
rtspEncryption: strict
rtspsAddress: :8322
rtspServerCert: /var/lib/screenshare-tls/cert.pem
rtspServerKey: /var/lib/screenshare-tls/key.pem

rtmp: yes
rtmpEncryption: strict
rtmpsAddress: :1936
rtmpServerCert: /var/lib/screenshare-tls/cert.pem
rtmpServerKey: /var/lib/screenshare-tls/key.pem

hls: yes
hlsAddress: 127.0.0.1:8888

webrtc: yes
webrtcAddress: 127.0.0.1:8889
# The media leg is UDP and reaches the client directly, so it is not behind the proxy either.
webrtcLocalUDPAddress: :8189

api: yes
apiAddress: 127.0.0.1:9997

# --- Media over QUIC, which no proxy can front either --------------------------------
#
# Named here whichever way it is set, because MediaMTX starts it by default: a file that leaves
# the key out exposes a listener on 8892 and 8893 under a certificate the relay drew for itself,
# and that is a decision, not an omission.
#
# It is a watch leg and a browser's alone. The page the relay serves subscribes over WebTransport,
# which is HTTP/3 over UDP: Caddy terminates HTTP/1.1 and HTTP/2 on 443 and carries no CONNECT of
# that kind, so this listener is exposed directly and holds a certificate of its own, the shape
# RTSPS and RTMPS have.
#
# Two certificates, and only one of them is named here.
#
# The pair below serves the page over TCP, ordinary TLS a browser validates like any other site, so
# a deployment with a real name wants its ACME certificate here and gets an interstitial otherwise.
# It is overridden per deployment rather than written in: this file is shared with every other
# relay built from this repository, and MTX_MOQSERVERCERT and MTX_MOQSERVERKEY are where a host
# points it at the certificate it already has (modules/mediamtx-relay.nix in nixos-config).
#
# The WebTransport session over UDP carries a certificate MediaMTX generates in memory and rotates,
# ECDSA P-256 with a fortnight's validity, which the page pins by SHA-256 off /fingerprint. Nothing
# configures it and nothing should: those two properties are what the pinning rules demand
# (docs/network-architecture.md).
#
# The names stay relative so a deployment that overrides neither still starts: MediaMTX draws the
# pair on first start where it may write, which is the unit's state directory. An absolute path to
# a file nothing creates is a listener that fails to come up, and MediaMTX exits on that rather
# than serving the other legs without it.
moq: yes
moqHTTP2Address: :8892
moqHTTP3Address: :8892
moqQUICAddress: :8893
moqServerCert: auto.crt
moqServerKey: auto.key

# --- Which paths exist -----------------------------------------------------------
#
# Any of them, created when something publishes one. A relay with no entry here configures no
# path at all and refuses every publisher with "path is not configured", whatever its token
# grants.
#
# A catch-all rather than a list, because there is nothing to list: a path is a group's prefix
# and a stream's name, the prefix is the digest of a key this relay never sees, and a group is
# made by drawing that key rather than by an operator writing it down here.
#
# It opens nothing. What a caller may publish or read is the path expression in its token, and
# a request the entry admits is still refused by the permission check above
# (backend/internal/token, GroupPermissions).
paths:
  all_others:
