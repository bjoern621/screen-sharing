# The self-contained Linux channel.
#
# The tarball beside it takes ffmpeg and GStreamer from the distribution and needs GStreamer 1.26,
# which is newer than the long-term releases of Debian and Ubuntu carry.
# This channel carries its own, so it installs on a distribution that packages neither
# (docs/packaging.md, "Per-channel packaging").
#
# Capture goes through the desktop portal, so the sandbox holds no privilege and grants none.
# kmsgrab is unreachable from inside it and wants CAP_SYS_ADMIN,
# which is the whole reason the portal path exists.
#
# The app is taken in already built rather than compiled here.
# The shell is a self-contained .NET publish whose restore reaches NuGet,
# and a flatpak-builder module builds with no network,
# so the build runs first and this assembles what it produced (scripts/package-linux.sh).
app-id: de.bjoernblessin.MirrorMe
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: mirrorme

# No debug extension, which is what every Linux channel here settles on:
# half of what ships is a .NET publish carrying no DWARF to split out
# (packaging/arch/PKGBUILD, packaging/fedora/mirrorme.spec).
# The split runs on the host's eu-strip as well,
# which an Ubuntu runner carries no elfutils for.
build-options:
  no-debuginfo: true

finish-args:
  # The relay: every publish and every watch crosses it, and the group service answers beside it.
  - --share=network
  # The shell draws under either session, and the frame channel imports through the GPU.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Desktop audio through the sound server, which pulsesrc opens as a sink's monitor.
  - --socket=pulseaudio
  # Per-application capture opens one program's output node, which is PipeWire's to answer,
  # and the portal hands its captured stream back over the same socket.
  - --filesystem=xdg-run/pipewire-0:ro

# The codecs the runtime leaves out, libx264 and libx265 among them.
# GStreamer's x264enc arrives with it, which is what the publish engine encodes H.264 with here.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '25.08'
    autodownload: true
    autodelete: false

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  # The two programs the backend spawns: ffmpeg for capture, encode and publish,
  # and ffplay for the single-stream viewer window.
  # The runtime carries the libraries and the extension above disables its programs,
  # so the executables are built here or they are nowhere.
  #
  # Built against what the runtime already provides.
  # libx264 and libx265 are the extension's libraries rather than build inputs,
  # so the ffmpeg engine's software rows probe false and the form greys them,
  # which is the answer the capability tables already give for an encoder a machine cannot run.
  - name: ffmpeg
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --enable-gpl
      - --enable-version3
      # ffplay, and the demuxer every X11 capture opens.
      - --enable-ffplay
      - --enable-sdl2
      - --enable-libxcb
      - --enable-libxcb-shm
      - --enable-libxcb-xfixes
      # The hardware path this channel reaches: VAAPI, on AMD and Intel.
      - --enable-vaapi
      # Desktop audio on the ffmpeg engine.
      - --enable-libpulse
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
        sha256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c

  # What scripts/package-linux.sh assembled: both binaries in one directory,
  # which is the layout the shell's own lookup expects.
  - name: mirrorme
    buildsystem: simple
    sources:
      # What the build task staged, one version at a time, so the glob below names one directory.
      # The licence and the notices travel inside it (scripts/package-linux.sh).
      - type: dir
        path: ../../build/dist
      - type: file
        path: ../linux/mirrorme.desktop
      - type: dir
        path: ../../build/icons
        dest: icons
    build-commands:
      - install -d /app/lib/mirrorme
      - cp -r mirrorme-*-portable/. /app/lib/mirrorme/
      - chmod 755 /app/lib/mirrorme/mirrorme-backend /app/lib/mirrorme/mirrorme
      # A launcher rather than a symlink:
      # the shell starts the backend from beside itself,
      # and a symlinked entry point would answer /app/bin.
      - install -d /app/bin
      - printf '#!/bin/sh\nexec /app/lib/mirrorme/mirrorme "$@"\n' > /app/bin/mirrorme
      - chmod 755 /app/bin/mirrorme
      # The desktop entry and the icon carry the application id, which is the name an install looks for.
      - install -Dm644 mirrorme.desktop /app/share/applications/de.bjoernblessin.MirrorMe.desktop
      - desktop-file-edit --set-icon=de.bjoernblessin.MirrorMe /app/share/applications/de.bjoernblessin.MirrorMe.desktop
      # hicolor's index declares 48 through 512,
      # and a size it omits is a directory no lookup walks.
      - for size in 48 64 128 256 512; do install -Dm644 "icons/$size.png" "/app/share/icons/hicolor/${size}x${size}/apps/de.bjoernblessin.MirrorMe.png"; done
      - install -Dm644 /app/lib/mirrorme/LICENSE /app/share/licenses/mirrorme/LICENSE
      - install -Dm644 /app/lib/mirrorme/THIRD-PARTY-NOTICES.md /app/share/doc/mirrorme/THIRD-PARTY-NOTICES.md
