# The self-contained Linux channel.
#
# The tarball beside it takes ffmpeg and GStreamer from the distribution and needs GStreamer 1.26,
# which is newer than the long-term releases of Debian and Ubuntu carry.
# This channel carries its own, so it installs on a distribution that packages neither
# (docs/packaging.md, "Per-channel packaging").
#
# Capture goes through the desktop portal, so the sandbox holds no privilege and grants none.
# kmsgrab is unreachable from inside it and wants CAP_SYS_ADMIN,
# which is the whole reason the portal path exists.
#
# The app is taken in already built rather than compiled here.
# The shell is a self-contained .NET publish whose restore reaches NuGet,
# and a flatpak-builder module builds with no network,
# so the build runs first and this assembles what it produced (packaging/linux/package.sh).
app-id: de.bjoernblessin.MirrorMe
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
# The WebRTC plugin below is Rust, and the SDK carries no compiler for it.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mirrorme

# No debug extension, which is what every Linux channel here settles on:
# half of what ships is a .NET publish carrying no DWARF to split out
# (packaging/arch/PKGBUILD, packaging/fedora/mirrorme.spec).
# The split runs on the host's eu-strip as well,
# which an Ubuntu runner carries no elfutils for.
build-options:
  no-debuginfo: true

finish-args:
  # The relay: every publish and every watch crosses it, and the group service answers beside it.
  - --share=network
  # The shell draws under either session, and the frame channel imports through the GPU.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Desktop audio through the sound server, which pulsesrc opens as a sink's monitor.
  - --socket=pulseaudio
  # Per-application capture opens one program's output node, which is PipeWire's to answer,
  # and the portal hands its captured stream back over the same socket.
  - --filesystem=xdg-run/pipewire-0:ro
  # The plugins this manifest builds, which GStreamer reaches through no path of its own:
  # its built-in one is the runtime's prefix and flatpak clears every GST_ variable off the host.
  # Prepended rather than replacing, so the runtime's own plugins still register.
  - --env=GST_PLUGIN_PATH=/app/lib/gstreamer-1.0

# The codecs the runtime leaves out, libx264 and libx265 among them.
# GStreamer's x264enc arrives with it, which is what the publish engine encodes H.264 with here.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '25.08'
    autodownload: true
    autodelete: false

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  # The two programs the backend spawns: ffmpeg for capture, encode and publish,
  # and ffplay for the single-stream viewer window.
  # The runtime carries the libraries and the extension above disables its programs,
  # so the executables are built here or they are nowhere.
  #
  # Built against what the runtime already provides.
  # libx264 and libx265 are the extension's libraries rather than build inputs,
  # so the ffmpeg engine's software rows probe false and the form greys them,
  # which is the answer the capability tables already give for an encoder a machine cannot run.
  - name: ffmpeg
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --enable-gpl
      - --enable-version3
      # ffplay, and the demuxer every X11 capture opens.
      - --enable-ffplay
      - --enable-sdl2
      - --enable-libxcb
      - --enable-libxcb-shm
      - --enable-libxcb-xfixes
      # The hardware path this channel reaches: VAAPI, on AMD and Intel.
      - --enable-vaapi
      # Desktop audio on the ffmpeg engine.
      - --enable-libpulse
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
        sha256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c

  # vainfo, which names the VA driver an encode runs through (backend/internal/gpu).
  # Without it no driver is identified, so the codec table's DriverDefect rows all miss
  # and the form offers a combination the running driver is known to crash on.
  # The runtime carries libva and no program to query it with,
  # freedesktop shipping vainfo as an application of its own.
  #
  # 2.22.0 is the libva the runtime carries.
  # Only the vainfo target is compiled,
  # the rest of the project being VA-API sample programs that install a dozen binaries beside it.
  # internal/gpu asks for the drm display first, so the build requires that backend.
  - name: libva-utils
    buildsystem: simple
    build-commands:
      - meson setup _build --prefix=/app -Ddrm=true -Dx11=false -Dwayland=false
      - meson compile -C _build vainfo
      - install -Dm755 _build/vainfo/vainfo /app/bin/vainfo
    sources:
      - type: archive
        url: https://github.com/intel/libva-utils/archive/refs/tags/2.22.0.tar.gz
        sha256: 7b57615c130427ec134bb5d2b80af516ce5bb19a40e89b1dab46a0d59760d96c

  # The transport legs the runtime's GStreamer registers no element for.
  # Its gst-plugins-bad is built against no libsrt, and gst-rtsp-server is no part of it at all,
  # so a stock runtime carries neither srtsink nor rtspclientsink
  # and the setup screen greys SRT and RTSP with the missing element named.
  # Both are pinned to the GStreamer the runtime carries, plugin and library moving together.
  - name: libsrt
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      # The library alone: srt-live-transmit and the other programs are nothing the app spawns.
      - -DENABLE_APPS=OFF
      - -DENABLE_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/Haivision/srt/archive/refs/tags/v1.5.7.tar.gz
        sha256: 017cd1e437ef2073a4dd10ddf7b55e86bc3d6ebac0393d13bd22f6a57055d32b

  # One plugin out of gst-plugins-bad, the runtime carrying every other one already.
  # auto_features=disabled holds the configure step to it,
  # and only the plugin is installed:
  # a full install would put this build's copy of every gst-plugins-bad library in /app,
  # ahead of the identical ones the runtime already carries.
  - name: gst-plugins-bad-srt
    buildsystem: simple
    build-commands:
      - meson setup _build --prefix=/app -Dauto_features=disabled -Dsrt=enabled
      - meson compile -C _build
      - install -Dm755 _build/ext/srt/libgstsrt.so /app/lib/gstreamer-1.0/libgstsrt.so
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.26.11.tar.xz
        sha256: 110fb82795f0e569b1e27b12ab9699d35c7762e1ff4db95335d6ac8d1442af3d

  # The two WebRTC legs, one plugin each:
  # whipclientsink publishes and lives in rswebrtc, whepsrc watches and lives in webrtchttp.
  # The runtime builds gst-plugins-rs from a fixed plugin list carrying neither,
  # so both crates are compiled here against the same GStreamer.
  # Each takes a *-cargo-sources.json pinning every crate by hash,
  # and a *-Cargo.lock pinning the versions,
  # both generated by flatpak-cargo-generator.py from the lock cargo resolves for that crate,
  # the way packaging/nix/deps.json pins NuGet.
  # No cargo-c: each crate declares a cdylib, so plain cargo produces the plugin.
  - name: gst-plugin-webrtc
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gst-plugin-webrtc/cargo
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/libgstrswebrtc.so
        /app/lib/gstreamer-1.0/libgstrswebrtc.so
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://static.crates.io/crates/gst-plugin-webrtc/gst-plugin-webrtc-0.15.3.crate
        sha256: cca3eb7568b17215505668b3cf09afc7780ecd03fe034efd02894da151abeac8
      - type: file
        path: rswebrtc-Cargo.lock
        dest-filename: Cargo.lock
      - rswebrtc-cargo-sources.json

  - name: gst-plugin-webrtchttp
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/gst-plugin-webrtchttp/cargo
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/libgstwebrtchttp.so
        /app/lib/gstreamer-1.0/libgstwebrtchttp.so
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://static.crates.io/crates/gst-plugin-webrtchttp/gst-plugin-webrtchttp-0.15.0.crate
        sha256: 9059b4836d2f3a98e34b62b11058e917d1f4743c968623636b755e74a06056e3
      # crates.io publishes no lock file with a library crate, and --offline resolves against one.
      - type: file
        path: webrtchttp-Cargo.lock
        dest-filename: Cargo.lock
      - webrtchttp-cargo-sources.json

  # rtspclientsink, which every RTSP publish and every synthetic test stream ends in.
  # The sink is a feature of its own here,
  # so auto_features=disabled alone installs the server library and no plugin at all.
  - name: gst-rtsp-server
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Drtspclientsink=enabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-rtsp-server/gst-rtsp-server-1.26.11.tar.xz
        sha256: b61d4304d8ceaaaa1ba139fb1ce935f04f1a73d7e18243c0a05b2fb04305406f

  # What packaging/linux/package.sh assembled: both binaries in one directory,
  # which is the layout the shell's own lookup expects.
  - name: mirrorme
    buildsystem: simple
    sources:
      # What the build task staged, one version at a time, so the glob below names one directory.
      # The licence and the notices travel inside it (packaging/linux/package.sh).
      - type: dir
        path: ../../build/dist
      - type: file
        path: ../linux/mirrorme.desktop
      - type: dir
        path: ../icons
        dest: icons
    build-commands:
      - install -d /app/lib/mirrorme
      - cp -r mirrorme-*-portable/. /app/lib/mirrorme/
      - chmod 755 /app/lib/mirrorme/mirrorme-backend /app/lib/mirrorme/mirrorme
      # A launcher rather than a symlink:
      # the shell starts the backend from beside itself,
      # and a symlinked entry point would answer /app/bin.
      - install -d /app/bin
      - printf '#!/bin/sh\nexec /app/lib/mirrorme/mirrorme "$@"\n' > /app/bin/mirrorme
      - chmod 755 /app/bin/mirrorme
      # The desktop entry and the icon carry the application id, which is the name an install looks for.
      - install -Dm644 mirrorme.desktop /app/share/applications/de.bjoernblessin.MirrorMe.desktop
      - desktop-file-edit --set-icon=de.bjoernblessin.MirrorMe /app/share/applications/de.bjoernblessin.MirrorMe.desktop
      # hicolor's index declares 48 through 512,
      # and a size it omits is a directory no lookup walks.
      - for size in 48 64 128 256 512; do install -Dm644 "icons/$size.png" "/app/share/icons/hicolor/${size}x${size}/apps/de.bjoernblessin.MirrorMe.png"; done
      - install -Dm644 /app/lib/mirrorme/LICENSE /app/share/licenses/mirrorme/LICENSE
      - install -Dm644 /app/lib/mirrorme/THIRD-PARTY-NOTICES.md /app/share/doc/mirrorme/THIRD-PARTY-NOTICES.md
