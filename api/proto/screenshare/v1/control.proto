syntax = "proto3";

package screenshare.v1;

import "screenshare/v1/catalog.proto";
import "screenshare/v1/events.proto";
import "screenshare/v1/form.proto";
import "screenshare/v1/session.proto";
import "screenshare/v1/settings.proto";
import "screenshare/v1/text.proto";

option go_package = "bjoernblessin.de/screenshare/api/gen/go/screenshare/v1;screensharev1";
option csharp_namespace = "ScreenShare.Api.V1";

// ControlService is the whole surface a shell may reach. There is no second way in:
// no shared file the shell parses, no relay endpoint it calls directly, no
// environment variable it reads to learn a port. Everything it knows, it learned
// from a method here.
//
// The methods divide into three kinds, and the division is the boundary rule
// (docs/ipc-api.md):
//
//   Reads    hand the shell something to draw. They compute; they change nothing,
//            and they are cheap enough to call on a keystroke or a mount.
//   Effects  do the one thing the user asked for. They are the only methods that
//            change the world, and the measurements are among them: probing the
//            uplink, timing the encoder and running the encoder probe all start real
//            work, take seconds, and leave something behind that a later read sees.
//   Stream   is the one server-streaming method, which carries what changed.
//
// A method that is neither a read nor one of the listed effects does not belong
// here, and a shell that wants one is a shell about to hold state the backend owns.
service ControlService {
  // --- Handshake ---------------------------------------------------------------

  // Hello is the first call on a connection. It settles which contract version both
  // sides are on before any other method is reached, so a mismatch is a sentence
  // rather than a field that silently arrives empty.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // --- Reads -------------------------------------------------------------------

  // GetCatalog returns every fixed fact about this machine and the encoding model,
  // as it is known now. It changes nothing and is answered immediately: the encoder
  // probe is ProbeEncoders below, and what it finds arrives here on the next call
  // and on the event stream for every shell, including the ones that did not ask.
  rpc GetCatalog(GetCatalogRequest) returns (GetCatalogResponse);

  // GetSettings returns the settings the backend holds. They are the starting draft
  // for a form and the values a fresh shell opens on.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // ResolveForm turns a settings draft into the complete description of the screen:
  // every field, every option, every greying and its reason, the diagnostics and the
  // derived figures. It is the method that makes a shell a display.
  //
  // It has no side effect and is safe to call on every keystroke. It reads what has
  // been probed rather than probing, and it does not save: a form is resolved far
  // more often than a value is committed, and a resolve that wrote would make every
  // intermediate keystroke a persisted setting.
  rpc ResolveForm(ResolveFormRequest) returns (ResolveFormResponse);

  // ListPresets returns the user's saved configurations. The notice states why the
  // store could not be read, in which case the list is empty because nothing
  // readable remained rather than because nothing was saved, and the difference is
  // the user's to see.
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);

  // GetPublishState reports whether a stream is in force and whether the held
  // settings have moved off it. A shell reads it when it mounts and receives the
  // same message on the event stream thereafter.
  rpc GetPublishState(GetPublishStateRequest) returns (PublishState);

  // GetRelayStatus returns the current relay snapshot. The backend polls the relay
  // on its own interval and this returns the latest, so several shells reading it
  // do not multiply the polling and the byte-delta bitrates stay computed against
  // one steady interval.
  rpc GetRelayStatus(GetRelayStatusRequest) returns (RelayStatus);

  // GetViewerState returns the external viewers currently open.
  rpc GetViewerState(GetViewerStateRequest) returns (ViewerState);

  // GetTestStreamState reports how many synthetic publishers are alive.
  rpc GetTestStreamState(GetTestStreamStateRequest) returns (TestStreamState);

  // GetReceiveState returns the streams the backend is decoding.
  rpc GetReceiveState(GetReceiveStateRequest) returns (ReceiveState);

  // --- Effects -----------------------------------------------------------------

  // SaveSettings persists the settings the shell holds. It does not touch a running
  // stream: what reaches a live pipeline is asked for separately, by ApplyToStream,
  // because both engines run a child built from an argv and neither takes a value
  // back afterwards.
  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsResponse);

  // SavePreset stores the settings under a name, replacing a same-named preset.
  rpc SavePreset(SavePresetRequest) returns (SavePresetResponse);

  // DeletePreset removes a named preset.
  rpc DeletePreset(DeletePresetRequest) returns (DeletePresetResponse);

  // StartPublish persists the settings and starts the encoder on them. It is
  // refused while a stream is already in force, a retry backoff included, because
  // that is a stream the user asked for and has not stopped.
  rpc StartPublish(StartPublishRequest) returns (StartPublishResponse);

  // ApplyToStream restarts the running stream on new settings. It is how an edit
  // reaches a live pipeline, and it is a separate method from SaveSettings because
  // the user's two intentions are different: keep this for next time, and put this
  // on the air now.
  //
  // The command is rendered before anything is torn down, so a combination no engine
  // can build refuses the call and leaves the stream running what it has. A launch
  // that fails after the teardown leaves nothing publishing: the pipeline carrying
  // the stream is gone by then, and there is no earlier one to return to.
  rpc ApplyToStream(ApplyToStreamRequest) returns (ApplyToStreamResponse);

  // StopPublish ends the stream, whether it is running or waiting out a backoff. A
  // stop is the one answer the retry budget has no say in.
  rpc StopPublish(StopPublishRequest) returns (StopPublishResponse);

  // StartWatch opens an external viewer for one stream over one transport. The
  // transport is per viewer and independent of the publish leg, so the same stream
  // can be watched over any leg the relay serves it on. A leg that cannot carry the
  // stream's format is refused with the format named, rather than opening a viewer
  // that connects and receives nothing.
  rpc StartWatch(StartWatchRequest) returns (StartWatchResponse);

  // StopWatch closes one open viewer.
  rpc StopWatch(StopWatchRequest) returns (StopWatchResponse);

  // StartReceive opens a decode for one stream on one leg, inside the backend. It is
  // the tile path's counterpart of StartWatch, and the difference between the two is
  // where the frames end up: a watch opens a player window the backend does not draw
  // in, and a receive decodes into this process, from where the frame channel hands
  // the frames to the shell (docs/viewer-architecture.md).
  //
  // What it opens is a decode and not a tile. Nothing here says where the frames are
  // drawn, how large, beside which others or in what order: that is the shell's whole
  // job, and it is why the grid this replaces was the wrong surface.
  //
  // A leg that cannot carry the stream's format is refused with the format named,
  // rather than opening a pipeline that connects and decodes nothing.
  rpc StartReceive(StartReceiveRequest) returns (StartReceiveResponse);

  // StopReceive closes one running decode.
  rpc StopReceive(StopReceiveRequest) returns (StopReceiveResponse);

  // SetReceiveAudio sets how loud one decode plays, and whether it plays at all.
  //
  // It is an effect on the receiver rather than anything the frame channel carries.
  // The audio branch ends in a sink of its own inside this process, because the
  // backend runs on the machine the shell is on and carrying samples across the
  // process boundary would only be a longer way to the same output device
  // (docs/viewer-architecture.md).
  //
  // The volume is a property of the decode and not of a window drawing it. Two
  // windows on one decode share one audio branch, so a per-window volume would be
  // two controls over one element, each showing a value the other had overwritten.
  //
  // Idempotent in both directions: a request for the loudness a decode already has
  // succeeds and does nothing, and a volume set before the decoder has exposed an
  // audio pad is held and applied when it does. A decode that does not exist is
  // NOT_FOUND with the pair named - that is a request about something absent rather
  // than a state that already holds.
  rpc SetReceiveAudio(SetReceiveAudioRequest) returns (SetReceiveAudioResponse);

  // StartTestStreams launches synthetic publishers, which exercise the viewing
  // paths without a screen capture. A running set is replaced.
  rpc StartTestStreams(StartTestStreamsRequest) returns (StartTestStreamsResponse);

  // StopTestStreams stops every synthetic publisher.
  rpc StopTestStreams(StopTestStreamsRequest) returns (StopTestStreamsResponse);

  // ProbeEncoders test-encodes on every engine and records what this machine can
  // really run, so a form can grey NVENC on a machine with no NVIDIA GPU.
  //
  // It is an effect and not a flag on GetCatalog, which is what it used to be. It
  // costs seconds on its first call and nothing afterwards, it replaces the result
  // that ResolveForm answers from, and the answer it lands reaches every shell on
  // the event stream. A read carrying it meant one shell's request changed what a
  // different shell's next resolve said, with nothing on the wire to announce it.
  rpc ProbeEncoders(ProbeEncodersRequest) returns (ProbeEncodersResponse);

  // MeasureUplink probes this machine's real upload throughput, so a shell can
  // replace the user's guessed uplink figure with a measured one.
  //
  // It and MeasureEncodeRate both run the real thing, take seconds, and are refused
  // while a stream is publishing: one would compete with the stream for the line and
  // the other with the encoder for the silicon. The refusal is FAILED_PRECONDITION
  // with that as the reason, and the form carries it on the button rather than
  // greying the figure.
  rpc MeasureUplink(MeasureUplinkRequest) returns (MeasureUplinkResponse);

  // MeasureEncodeRate times the configured encoder on generated frames of the
  // captured monitor's size, so a shell can say whether the target frame rate is
  // above what this machine encodes at these settings.
  rpc MeasureEncodeRate(MeasureEncodeRateRequest) returns (MeasureEncodeRateResponse);

  // ForgetPortalConsent drops the stored screen-capture consent, so the next
  // capture asks the compositor to pick again. It is how a share aimed at the wrong
  // window or monitor is corrected.
  rpc ForgetPortalConsent(ForgetPortalConsentRequest) returns (ForgetPortalConsentResponse);

  // OpenLog opens one run log in the machine's default application, and
  // OpenLogsFolder the directory holding them. They are backend methods because the
  // files are the backend's: it writes them, it rotates them, and it is the only
  // side that knows which of them still exist under the name it handed out.
  rpc OpenLog(OpenLogRequest) returns (OpenLogResponse);
  rpc OpenLogsFolder(OpenLogsFolderRequest) returns (OpenLogsFolderResponse);

  // --- Stream ------------------------------------------------------------------

  // Subscribe delivers what changed, for as long as the shell holds the call. See
  // events.proto for why every event carries a whole state and why a shell that
  // acted still waits for the event.
  rpc Subscribe(SubscribeRequest) returns (stream Event);

  // SubscribeAudioLevels delivers how loud every decode is, on a fixed cadence, for
  // as long as the shell holds the call.
  //
  // A stream of its own rather than an event kind, and the difference is cadence.
  // Subscribe carries whole states when something changed, and a level changes
  // continuously: folding it in would push the receive state at metering rate and
  // make every consumer of that state re-render for a number none of them read.
  //
  // A read and not an effect, so it belongs on this service rather than on the frame
  // channel. That channel carries frames alone, and a level is not one; being
  // frequent is not what put it there.
  //
  // One call covers every decode, so a tile appearing needs no second subscription
  // and a tile leaving needs no cancellation. Each tick is the whole set: a decode
  // with no audio track has no entry, and one that is silent has an entry reading
  // negative infinity. The backend coalesces to the newest tick, so a reader that
  // fell behind receives the present rather than a queue of the past.
  rpc SubscribeAudioLevels(SubscribeAudioLevelsRequest) returns (stream AudioLevels);
}

// --- Handshake ------------------------------------------------------------------

message HelloRequest {
  // client is what the shell calls itself, for the backend's log: "avalonia",
  // "cli". It carries no behaviour.
  string client = 1;
  // protocol_major is the contract version the shell was generated against. The
  // backend refuses a major it does not implement, with FAILED_PRECONDITION and both
  // versions named.
  uint32 protocol_major = 2;
}

message HelloResponse {
  // protocol_major is the contract this backend implements, and protocol_minor how
  // far into it: a shell built against a lower minor works, and one built against a
  // higher minor may find a method missing.
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  // backend_version is the build, for display and for bug reports.
  string backend_version = 3;
}

// --- Read requests and responses --------------------------------------------------
//
// A read whose state also travels on the event stream answers with that state's own
// message and not with a wrapper, because two shapes for one state is the drift this
// contract exists to end. The rest are wrapped, so that a response can grow a field
// the state itself has no business carrying.

message GetCatalogRequest {
  // 1 was probe_encoders, which made this read start the probe. It is the
  // ProbeEncoders effect now.
  reserved 1;
  reserved "probe_encoders";
}

message GetCatalogResponse {
  Catalog catalog = 1;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
  // store_notice states why the persisted settings could not be restored, absent when
  // they were. The settings above are then the defaults, and the file holding the old
  // values has been moved aside rather than overwritten, so the notice carries where
  // they are.
  Text store_notice = 3;

  // 2 was store_notice as prose.
  reserved 2;
}

// ResolveFormRequest carries the draft the user is editing. It is the whole
// settings message and not a diff, because availability is a function of every
// field at once and a diff would leave the backend guessing what it is against.
message ResolveFormRequest {
  Settings settings = 1;
}

message ResolveFormResponse {
  Form form = 1;
}

message ListPresetsRequest {}

message ListPresetsResponse {
  repeated Preset presets = 1;
  // notice states why the preset store could not be read, absent when it was.
  Text notice = 3;

  // 2 was notice as prose.
  reserved 2;
}

message GetPublishStateRequest {}

message GetRelayStatusRequest {}

message GetViewerStateRequest {}

message GetTestStreamStateRequest {}

message GetReceiveStateRequest {}

// --- Effect requests and responses ------------------------------------------------
//
// Every effect answers with an empty message rather than with the new state, except
// the two measurements, whose figure is the answer and belongs to the caller that
// paid the seconds for it. What the state became arrives on the event stream, which
// is the one path into the display: a shell that read the answer here and a shell
// that only listened would otherwise be two ways of learning one fact.

message SaveSettingsRequest {
  Settings settings = 1;
}

message SaveSettingsResponse {}

// SavePresetRequest stores one way of publishing. A preset is a PublishSettings and
// nothing else: where the relay is belongs to a deployment and how this machine
// watches belongs to a viewer, and neither is part of what a saved configuration
// means.
message SavePresetRequest {
  string name = 1;
  PublishSettings settings = 2;
}

message SavePresetResponse {}

message DeletePresetRequest {
  string name = 1;
}

message DeletePresetResponse {}

// StartPublishRequest and ApplyToStreamRequest carry the whole Settings rather than
// the two groups a pipeline is built from, because both persist the draft they are
// given: they are how the settings a shell holds reach the backend, and half of them
// arriving would leave the other half at whatever was stored before.
message StartPublishRequest {
  Settings settings = 1;
}

message StartPublishResponse {}

message ApplyToStreamRequest {
  Settings settings = 1;
}

message ApplyToStreamResponse {}

message StopPublishRequest {}

message StopPublishResponse {}

message StartWatchRequest {
  WatchKey viewer = 3;

  // 1 and 2 were stream_name and transport, the pair WatchKey exists to be.
  reserved 1, 2;
  reserved "stream_name", "transport";
}

message StartWatchResponse {}

message StopWatchRequest {
  WatchKey viewer = 3;

  reserved 1, 2;
  reserved "stream_name", "transport";
}

message StopWatchResponse {}

// StartReceiveRequest names the stream and the leg, which together are the identity a
// receive is keyed by, for the reason WatchKey exists: the relay re-serves each stream
// on all its listeners, so one stream can be decoded over several legs at once.
//
// The leg is named here rather than read off ViewerSettings.tile_watch_transport,
// which is the same rule StartWatch follows: the setting is what a shell offers by
// default, and the call is what was chosen.
//
// The render chain is not on this message. It is one value for every decode
// (ViewerSettings), because a chain falls back where a driver cannot run it and that
// is a property of the machine rather than of a stream.
message StartReceiveRequest {
  WatchKey stream = 1;
}

message StartReceiveResponse {}

message StopReceiveRequest {
  WatchKey stream = 1;
}

message StopReceiveResponse {}

// SetReceiveAudioRequest names both halves of the loudness at once, rather than a
// volume method and a mute method.
//
// One request because they are one state. Sent apart, a shell that muted and then
// set a volume would have to know whether the second undid the first, and the
// backend would have to decide the same thing twice.
message SetReceiveAudioRequest {
  WatchKey stream = 1;
  // volume is a linear gain from zero, where one is the stream unchanged. Values
  // above one amplify; the backend bounds them rather than letting a slider clip the
  // output device.
  double volume = 2;
  // muted silences the branch without losing the volume, so unmuting returns to the
  // level the reader chose.
  bool muted = 3;
}

message SetReceiveAudioResponse {}

message StartTestStreamsRequest {
  // count is how many synthetic publishers to run. Each runs its own software
  // encoder, so the backend bounds it and refuses a larger number rather than
  // saturating the machine.
  int32 count = 1;
}

message StartTestStreamsResponse {}

message StopTestStreamsRequest {}

message StopTestStreamsResponse {}

message ProbeEncodersRequest {}

message ProbeEncodersResponse {}

message MeasureUplinkRequest {}

message MeasureUplinkResponse {
  double mbps = 1;
}

message MeasureEncodeRateRequest {
  // settings decide what is timed, and the picture size comes from the monitor they
  // name rather than from the caller: it is the same enumeration the capture crops
  // to and the estimate is priced from.
  //
  // The whole Settings rather than the publish group alone: what is timed is the
  // command the same builders would render for a publish, and holding a narrower
  // message here would mean two shapes reaching one set of builders.
  Settings settings = 1;
}

message MeasureEncodeRateResponse {
  EncodeRate rate = 1;
}

message ForgetPortalConsentRequest {}

message ForgetPortalConsentResponse {}

message OpenLogRequest {
  // path is a log path the backend handed out, on an ExitInfo. A shell does not
  // construct one.
  string path = 1;
}

message OpenLogResponse {}

message OpenLogsFolderRequest {}

message OpenLogsFolderResponse {}

// --- Stream requests --------------------------------------------------------------

// SubscribeRequest opens the stream.
message SubscribeRequest {
  // A shell receives every kind by default. Naming kinds here narrows the stream to
  // those, which exists for a surface that wants the state changes without the
  // per-second statistics.
  //
  // EVENT_KIND_UNSPECIFIED is refused rather than ignored, so a shell that sent a
  // kind this build's enum has no value for learns it on the call it made the
  // mistake on rather than by waiting forever.
  repeated EventKind kinds = 2;

  // 1 was kinds as strings naming this message's own oneof fields.
  reserved 1;
}

// SubscribeAudioLevelsRequest carries nothing.
//
// Empty and present rather than absent: the cadence is the backend's, because a
// shell asking for a rate is asking for a cost it does not pay, and the set of
// decodes is the backend's too. A message with no fields is what lets either become
// a request field later without a new method.
message SubscribeAudioLevelsRequest {}
