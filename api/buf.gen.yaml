version: v2

# The Go half of the contract.
# The C# half comes from Grpc.Tools during the Avalonia build, off these same .proto files,
# so the schema has no second copy and no step to forget on one side alone.
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
