version: v2

# The Go half of the contract. The C# half is generated by Grpc.Tools during the
# Avalonia build, straight from these same .proto files, so there is no second copy
# of the schema and no step that can be forgotten on one side only.
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
