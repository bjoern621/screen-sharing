version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  except:
    # A response message is named for the state it carries,
    # not for the method that returned it,
    # in the four cases where that state also travels on the event stream:
    # GetPublishState and the publish_state event answer with the same PublishState,
    # and the same holds for RelayStatus, ViewerState and TestStreamState.
    # Two names for one shape is the drift this contract exists to prevent,
    # so the rule that would demand them is off for those four.
    # Every other read is wrapped,
    # so a response can grow a field the state itself has no business carrying.
    - RPC_RESPONSE_STANDARD_NAME
    # GetReceiveState answers with ReceiveState for the same reason:
    # the read and the receive_state event carry one shape.

breaking:
  use:
    - FILE
  # Nothing is excepted.
  # A report buf raises is read and accepted rather than configured away,
  # so a renamed field and a deleted one both land in the review.
  # An except entry outlives the commit it is written for,
  # and the reasoning, with the release the rule starts at,
  # is in docs/ipc-api.md, "Versioning".
