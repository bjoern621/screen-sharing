# MediaMTX minimal relay config
# Trusted friends: anyone can publish/read. Lock down later with per-path user/pass.

logLevel: info

# per-reader outgoing queue (packets). Default 512 chokes on lossless keyframe
# bursts (one frame can be several MB); 16384 ~= 24MB headroom per reader.
writeQueueSize: 16384

# --- HTTP API (discovery: list who is live) ---
api: yes
apiAddress: :9997

# Trusted friends: allow anyone to publish/read AND query the API (discovery).
# Lock down later by replacing 'any' with named user/pass per action.
authInternalUsers:
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# --- SRT (main transport: publish + read) ---
srt: yes
srtAddress: :8890

# --- RTSP ---
rtsp: yes
rtspAddress: :8554

# --- RTMP (publish + read; also the ingest broadcast tools speak) ---
rtmp: yes
rtmpAddress: :1935

# --- HLS (watch only: the relay serves segments and ingests none) ---
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

# --- WebRTC (WHIP publish, WHEP watch: browser and native grid) ---
webrtc: yes
webrtcAddress: :8889

# --- Media over QUIC (watch only: no publish engine here speaks it) ---
# The relay re-serves every ingested stream over MoQ and a browser reads it with
# WebTransport + WebCodecs, which is the one leg carrying every format this app
# encodes. Only a browser reaches it: no player opens the address and no receive
# pipeline subscribes (docs/viewer-architecture.md).
#
# TLS is not optional: WebTransport refuses a plain listener, so this leg is
# encrypted on a LAN relay too.
#
# The pair below is the page's alone, ordinary TLS a browser validates against a CA.
# auto.crt/auto.key make MediaMTX draw a self-signed one on first start, which every
# browser answers with an interstitial: fine on a LAN, and a relay with a real name
# points these at its certificate instead.
#
# The WebTransport session is not this pair and takes no configuration. MediaMTX
# generates that certificate itself and the page pins its SHA-256 off /fingerprint,
# a hash-pinned certificate being one no CA vouches for. The rules that come with
# pinning are the reason it is generated rather than configured: it may not be RSA
# and may not outlive 14 days, so MediaMTX draws ECDSA P-256 and rotates it
# (docs/network-architecture.md).
#
# MediaMTX rejects an unknown key outright, so these have to be the keys of the
# pinned version, not of whatever main has. moqQUICAddress arrived in v1.20.0; a
# relay older than that refuses to start on this file, which is why both pins name
# that release: the mediamtx override in flake.nix, and scripts/relay.ps1 for the
# Windows download.
moq: yes
moqHTTP2Address: :8892 # TCP: the player page, the fingerprint and the credential mirror
moqHTTP3Address: :8892 # UDP: the WebTransport session the page subscribes on
moqQUICAddress: :8893 # UDP: native MoQ-over-QUIC, for a client that is not a browser
moqServerCert: auto.crt
moqServerKey: auto.key

# Paths: 'all_others' = any path name auto-created, no auth.
# Each publisher picks own name via SRT streamid=publish:<name>
pathDefaults:
  # keep source alive briefly after publisher blip
  sourceOnDemandCloseAfter: 10s

paths:
  all_others:
