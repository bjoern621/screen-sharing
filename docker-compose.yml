services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8890:8890/udp"   # SRT
      - "8554:8554/tcp"   # RTSP
      - "1935:1935/tcp"   # RTMP
      - "8888:8888/tcp"   # HLS  (browser watch)
      - "8889:8889/tcp"   # WebRTC signaling
      - "8189:8189/udp"   # WebRTC media
      - "9997:9997/tcp"   # API  (who-is-live discovery)
